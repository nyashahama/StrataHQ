name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "eslint.config.mjs"
      - "hooks/**"
      - "lib/**"
      - "public/**"
      - "postcss.config.js"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.ts"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "vitest.setup.ts"
      - "next.config.*"
      - "proxy.ts"
      - "middleware.ts"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "eslint.config.mjs"
      - "hooks/**"
      - "lib/**"
      - "public/**"
      - "postcss.config.js"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.ts"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "vitest.setup.ts"
      - "next.config.*"
      - "proxy.ts"
      - "middleware.ts"
      - ".github/workflows/frontend-ci.yml"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
